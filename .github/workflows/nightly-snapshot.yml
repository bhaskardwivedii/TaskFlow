name: Nightly analytics snapshot

on:
  schedule:
    - cron: "30 19 * * *"   # 01:00 IST
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: server
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: unused-by-this-job
        run: npm ci --omit=dev && node scripts/refresh-snapshots.js --days=3
